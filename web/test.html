<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Hand Sign Detector</title>
    <link rel="stylesheet" href="css/test.css">

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
    <header class="app-header">
        <div>
            <h1>Naruto Hand Sign Detector</h1>
        </div>

        <div class="model-status">
            <span class="status-dot"></span>
            <span>Model Ready</span>
        </div>
    </header>
    
    <main class="app-container">
        <section class="camera-section">
            <div class="section-header">
                <h2>Camera</h2>
                <span id="status">No hands detected.</span>
            </div>

            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output"></canvas>
            </div>
        </section>

        <section class="prediction-section">
            <div class="prediction-header">
                <div>
                    <h2>Hand Sign Prediction</h2>
                </div>
            </div>

            <div class="prediction-card">
                <span class="prediction-label">Predicted Sign</span>
                <h3 id="prediction">Waiting...</h3>

                <div class="prediction-confidence">
                    <span>Confidence</span>
                    <strong id="prediction-confidence">0%</strong>
                </div>

                <div class="confidence-bar">
                    <div
                        id="prediction-confidence-bar"
                        class="confidence-fill"
                        style="width: 0%">
                    </div>
                </div>
            </div>

            <div class="probabilities-card">
                <div class="card-header">
                    <div>
                        <h3>Probabilities</h3>
                        <p>Model confidence for each hand sign</p>
                    </div>
                </div>

                <div id="probability-list">
                    <div class="probability-row">
                        <div class="probability-info">
                            <span class="sign-name">Unknown</span>
                            <span class="sign-probability">0%</span>
                        </div>

                        <div class="probability-bar">
                            <div
                                class="probability-fill"
                                style="width: 0%">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <span>Naruto Hand Sign Recognition</span>
        <span>MediaPipe + Machine Learning </span>
    </footer>
    <script type="module" src="js/camera-test.js"></script>
</body>
</html>
