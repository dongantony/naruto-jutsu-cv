<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jutsu Mode</title>
    <link rel="stylesheet" href="css/jutsu.css">
</head>
<body>
    <header class="app-header">
        <div>
            <h1>Jutsu Mode</h1>
            <p>Weave hand signs to perform a jutsu.</p>
        </div>
    </header>

    <main class="jutsu-container">
        <section class="camera-section">
            <h2>Weave Hand Signs</h2>

            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output"></canvas>
            </div>
        </section>

        <section class="jutsu-result">
            <span class="result-label">Current Jutsu</span>
            <h2 id="jutsu-name">Waiting...</h2>

            <p id="jutsu-description">Perform a sequence of hand signs to activate a jutsu.</p>
        </section>
    </main>

    <footer class="app-footer">
        <span>Naruto Hand Sign Recognition</span>
        <span>MediaPipe + Machine Learning</span>
    </footer>
    <script type="module" src="js/camera-jutsu.js"></script>
</body>
</html>
